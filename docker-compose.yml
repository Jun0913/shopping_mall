version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: shoppingmall-db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT}:3306" # 호스트포트:컨테이너포트
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
